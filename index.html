<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>半導体業界・進路選択ナビ</title>

<style>
:root {
  --navy: #12385b;
  --blue: #176b9c;
  --light-blue: #eef7fb;
  --teal: #198c8c;
  --text: #24313c;
  --subtext: #61717d;
  --border: #d9e3e8;
  --bg: #f4f7f9;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    "Noto Sans JP",
    sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 760px;
  margin: 0 auto;
  padding: 18px 20px;
}

.series {
  font-size: 13px;
  color: var(--blue);
  font-weight: 700;
  letter-spacing: 0.05em;
}

.site-title {
  margin-top: 5px;
  font-size: 23px;
  font-weight: 800;
  color: var(--navy);
}

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 24px 16px 50px;
}

.card {
  background: var(--white);
  border-radius: 18px;
  padding: 28px 22px;
  box-shadow: 0 8px 30px rgba(20, 55, 75, 0.06);
}

.start-card {
  text-align: center;
}

.start-icon {
  width: 74px;
  height: 74px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: var(--light-blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
}

h1 {
  margin: 0;
  color: var(--navy);
  font-size: 27px;
  line-height: 1.45;
}

.lead {
  margin: 18px auto 0;
  max-width: 560px;
  color: var(--subtext);
  line-height: 1.9;
  font-size: 15px;
}

.notice {
  margin-top: 22px;
  padding: 14px;
  background: #f7fafb;
  border-radius: 10px;
  color: var(--subtext);
  font-size: 13px;
  line-height: 1.7;
}

.primary-button {
  width: 100%;
  margin-top: 24px;
  padding: 18px;
  border: none;
  border-radius: 12px;
  background: var(--navy);
  color: white;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}

.primary-button:active {
  transform: scale(0.99);
}

.hidden {
  display: none !important;
}

.progress-area {
  margin-bottom: 24px;
}

.progress-text {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--subtext);
  margin-bottom: 9px;
}

.progress-bar {
  height: 8px;
  background: #e5edf1;
  border-radius: 999px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0;
  background: var(--teal);
  transition: width 0.3s;
}

.question-number {
  color: var(--blue);
  font-size: 14px;
  font-weight: 800;
}

.question {
  margin: 10px 0 24px;
  color: var(--navy);
  font-size: 24px;
  line-height: 1.55;
}

.options {
  display: grid;
  gap: 12px;
}

.option-button {
  width: 100%;
  padding: 18px 16px;
  background: white;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  text-align: left;
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: 0.2s;
}

.option-button:hover {
  border-color: var(--blue);
  background: #f8fcfe;
}

.option-button:active {
  transform: scale(0.99);
}

.back-button {
  margin-top: 20px;
  padding: 12px 4px;
  border: none;
  background: none;
  color: var(--blue);
  font-size: 14px;
  cursor: pointer;
}

.result-label {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--light-blue);
  color: var(--blue);
  font-size: 13px;
  font-weight: 800;
}

.result-title {
  margin: 14px 0 10px;
  color: var(--navy);
  font-size: 27px;
  line-height: 1.45;
}

.result-summary {
  color: var(--subtext);
  line-height: 1.9;
  font-size: 16px;
}

.result-section {
  margin-top: 22px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
}

.result-section h3 {
  margin: 0 0 10px;
  color: var(--navy);
  font-size: 17px;
}

.result-section p,
.result-section li {
  color: var(--subtext);
  line-height: 1.8;
  font-size: 15px;
}

.result-section ul {
  padding-left: 22px;
  margin-bottom: 0;
}

.highlight-box {
  margin-top: 24px;
  padding: 18px;
  border-radius: 12px;
  background: #f0f8f8;
}

.highlight-box h3 {
  margin: 0 0 8px;
  color: var(--teal);
  font-size: 17px;
}

.highlight-box p {
  margin: 0;
  color: var(--text);
  line-height: 1.8;
}

.restart-button {
  width: 100%;
  margin-top: 28px;
  padding: 17px;
  border: 1.5px solid var(--blue);
  border-radius: 12px;
  background: white;
  color: var(--blue);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 20px;
  color: #80909a;
  font-size: 12px;
}

@media (max-width: 480px) {
  .card {
    padding: 24px 18px;
  }

  h1 {
    font-size: 24px;
  }

  .question {
    font-size: 22px;
  }

  .result-title {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="series">SEMICONDUCTOR CAREER GUIDE</div>
    <div class="site-title">半導体業界・進路選択ナビ</div>
  </div>
</header>

<main>

<section id="startScreen" class="card start-card">

    あなたに合う<br>
    半導体業界への進路を探す
  </h1>

  <p class="lead">

  <div class="notice">
    この診断は進路を決定するものではありません。<br>

    <button
      id="backButton"

    >
      ← 前の質問に戻る

  </div>

</section>


<section id="resultScreen" class="card hidden">

  <span class="result-label">
    あなたの進路タイプ
  </span>

  <h2 id="resultTitle" class="result-title"></h2>

  <p id="resultSummary" class="result-summary"></p>

  <div class="result-section">
    <h3>おすすめの進路ルート</h3>
    <p id="resultRoute"></p>
  </div>

  <div class="result-section">
    <h3>学びやすい分野</h3>
    <p id="resultField"></p>
  </div>

  <div class="result-section">
    <h3>向いている仕事の方向性</h3>
    <ul id="resultJobs"></ul>
  </div>

  <div class="result-section">
    <h3>この進路が候補になる理由</h3>
    <p id="resultReason"></p>
  </div>

  <div class="highlight-box">
    <h3>進路選択ナビからのアドバイス</h3>
    <p id="resultAdvice"></p>
  </div>

  <button class="restart-button" onclick="restartQuiz()">
    最初から診断する
  </button>

</section>

</main>

<footer>
  半導体業界・進路選択ナビ
</footer>


<script>

const questions = [

    ]
  },

      { text: "まだ将来のイメージができていない", value: "future" }
    ]
  }
];

let currentQuestion = 0;
let answers = [];

const categories = {
  engineering: {
    title: "技術・設計・開発を目指すタイプ",
    summary: "仕組みを理解し、専門的な技術を深める方向に関心があるようです。機械、電気電子、材料、情報などの基礎を学び、設計・開発・研究に関わる道が候補になります。",
    fields: "機械工学、電気電子工学、材料工学、化学、情報工学など。",
    jobs: [

    ],

    next: "興味のある大学・高専の学科を調べ、授業内容、研究室、卒業後の就職先を比べてみましょう。"
  },
  manufacturing: {
    title: "製造・実践技術を目指すタイプ",
    summary: "実際に装置や製品に触れながら技術を身につける方向に関心があるようです。半導体業界では、装置の組立、検査、製造、調整など、ものづくりを支える仕事があります。",
    fields: "機械系、電気電子系、制御系、ロボット系、生産工学など。",
    jobs: [
      "半導体製造装置の製造・組立",

    ],
    reason: "ものづくりへの興味や、実習を重視する学び方、実践的な技術を身につけたい希望が、この方向性と結びついています。",
    next: "学校の実習内容や設備、企業との連携、卒業生の就職先を調べてみましょう。"
  },
  software: {
    title: "IT・データ・ソフトウェアを活かすタイプ",
    summary: "プログラムやデータなど、デジタル技術を活用する仕事に関心があるようです。半導体業界では、装置制御、製造システム、データ分析、AI活用などの分野があります。",
    fields: "情報工学、ソフトウェア、データサイエンス、AI、制御工学など。",
    jobs: [
      "製造装置のソフトウェア開発",
      "制御システムの開発",
      "製造データの分析",
      "AI・ITを活用した業務改善"
    ],
    reason: "ITやプログラムへの興味が、半導体製造を支えるデジタル分野と結びついています。",
    next: "情報系の学科で学べるプログラミング、制御、データ分析の内容と、半導体企業の募集職種を調べましょう。"
  },
  quality: {
    title: "品質・改善・工程管理を目指すタイプ",
    summary: "製品や工程をより良くし、安定した品質を支える仕事に関心があるようです。半導体業界では、品質管理、品質保証、工程改善などが重要な役割を担います。",
    fields: "機械、電気電子、材料、化学、生産工学、品質管理関連分野など。",
    jobs: [
      "品質管理・品質保証",
      "製造工程の改善",
      "生産技術",
      "製品評価・解析"
    ],
    reason: "品質や工程を改善したいという関心が、製造の安定性や製品の信頼性を支える仕事と結びついています。",
    next: "品質や生産技術の仕事内容を企業の採用情報で確認し、必要な専門知識を調べてみましょう。"
  },
  exploration: {
    title: "幅広く可能性を探すタイプ",
    summary: "今は特定の仕事に絞るより、半導体業界の幅広い仕事を知ることが大切な段階のようです。興味がまだ決まっていなくても、進路選びを始めることはできます。",
    fields: "機械、電気電子、情報、材料、化学など。複数の分野を比較してみましょう。",
    jobs: [
      "製造・組立",
      "設計・開発",
      "品質管理",
      "生産技術",
      "IT・ソフトウェア"
    ],
    reason: "仕事の方向性がまだ定まっていない場合は、複数の職種を知り、学びながら興味を見つける方法が考えられます。",
    next: "まずは半導体業界の仕事を3種類ほど調べて、仕事内容や必要な知識を比べてみましょう。"
  }
};

function startQuiz() {
  currentQuestion = 0;
  answers = [];

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  const data = questions[currentQuestion];

  document.getElementById("questionNumber").innerText =
    "QUESTION " + (currentQuestion + 1);

  document.getElementById("questionText").innerText = data.question;

  document.getElementById("progressLabel").innerText =
    "質問 " + (currentQuestion + 1) + " / " + questions.length;

  const percent = Math.round(
    ((currentQuestion + 1) / questions.length) * 100
  );

  document.getElementById("progressPercent").innerText = percent + "%";
  document.getElementById("progressBar").style.width = percent + "%";

  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";

  data.options.forEach(option => {
    const button = document.createElement("button");
    button.className = "option-button";
    button.innerText = option.text;

    button.onclick = () => selectAnswer(option.value);

    optionsContainer.appendChild(button);
  });

  document.getElementById("backButton").classList.toggle(
    "hidden",
    currentQuestion === 0
  );
}

function selectAnswer(value) {
  answers[currentQuestion] = value;

  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    showQuestion();

    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    showResult();
  }
}

function goBack() {
  if (currentQuestion > 0) {
    currentQuestion--;
    showQuestion();
  }
}

function calculateScores() {
  const scores = {
    engineering: 0,
    manufacturing: 0,
    software: 0,
    quality: 0,
    exploration: 0
  };

  const interest = answers[1];
  const priority = answers[2];
  const environment = answers[3];
  const concern = answers[4];

  // 質問2：興味を最も強く反映
  const interestMap = {
    engineering: "engineering",
    manufacturing: "manufacturing",
    software: "software",
    quality: "quality",
    unknown: "exploration"
  };

  scores[interestMap[interest]] += 4;

  // 質問3：進路選択で重視すること
  if (priority === "specialist") {
    scores.engineering += 2;
    scores.software += 1;
  }

  if (priority === "practical") {
    scores.manufacturing += 2;
    scores.quality += 1;
  }

  if (priority === "employment") {
    scores.manufacturing += 1;
    scores.quality += 1;
    scores.exploration += 1;
  }

  if (priority === "options") {
    scores.engineering += 1;
    scores.software += 1;
    scores.exploration += 1;
  }

  if (priority === "cost") {
    scores.exploration += 1;
    scores.manufacturing += 1;
  }

  // 質問4：学び方の希望
  if (environment === "theory") {
    scores.engineering += 2;
    scores.software += 1;
  }

  if (environment === "practice") {
    scores.manufacturing += 2;
    scores.quality += 1;
  }

  if (environment === "early") {
    scores.manufacturing += 2;
    scores.quality += 1;
  }

  if (environment === "undecided") {
    scores.exploration += 2;
  }

  // 質問5：不安や悩みも診断に反映
  if (concern === "fit" || concern === "future") {
    scores.exploration += 2;
  }

  if (concern === "school") {
    scores.engineering += 1;
    scores.manufacturing += 1;
    scores.exploration += 1;
  }

  if (concern === "job") {
    scores.manufacturing += 1;
    scores.quality += 1;
    scores.software += 1;
  }

  if (concern === "money") {
    scores.exploration += 1;
    scores.manufacturing += 1;
  }

  return scores;
}

function getRoute(stage, priority, environment) {
  if (stage === "parent") {
    return "まずは本人の興味や希望を確認し、大学・高専・専門学校・就職の違いを一緒に比較しましょう。学費、通学地域、卒業後の進路、奨学金なども確認することが大切です。";
  }

  if (stage === "highschool") {
    if (priority === "cost") {
      return "大学・高専・専門学校・就職の各ルートについて、入学金、授業料、通学費、奨学金や授業料支援制度を比較しましょう。費用だけでなく、卒業後の進路も合わせて確認してください。";
    }

    if (environment === "practice" || environment === "early") {
      return "高専・専門学校・実習を重視する大学などを比較しましょう。実習内容や企業との連携、卒業後の就職実績が判断材料になります。";
    }

    return "大学・高専・専門学校を比較し、学べる分野と卒業後の職種を確認しましょう。大学では専門分野を幅広く学び、研究や開発を目指す道もあります。";
  }

  if (stage === "student") {
    return "現在の学校で学んでいる専門分野を、半導体業界のどの職種に活かせるか整理しましょう。研究室、実習、インターンシップ、企業説明会などを活用する方法があります。";
  }

  return "これまでの仕事や学習経験を整理し、半導体業界の求人にある応募条件と照らし合わせましょう。経験を活かせる職種から調べ、必要に応じて基礎知識や資格を補う方法が考えられます。";
}

function getConcernAdvice(concern, priority) {
  if (concern === "fit") {
    return "仕事内容を知ることから始めましょう。装置をつくる仕事、設計する仕事、品質を守る仕事などを比べると、自分の関心が見つかりやすくなります。";
  }

  if (concern === "school") {
    return "学校名だけで判断せず、学科の授業内容、実験・実習、研究内容、卒業後の就職先を確認しましょう。";
  }

  if (concern === "job") {
    return "企業の採用ページで職種別の応募条件を確認しましょう。学部・学科と募集職種の関係、インターンシップや学校推薦の有無も参考になります。";
  }

  if (concern === "money" || priority === "cost") {
    return "入学金・授業料・教材費・通学費を含めて総額を比較しましょう。奨学金や授業料支援制度は、学校や公的機関の最新情報を確認してください。";
  }

  return "最初から将来を一つに決める必要はありません。複数の仕事を知り、学校で学べる内容と結びつけながら、少しずつ選択肢を絞っていきましょう。";
}

function showResult() {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  const scores = calculateScores();

  const ranking = Object.entries(scores).sort((a, b) => b[1] - a[1]);

  const primaryKey = ranking[0][0];
  const secondaryKey = ranking[1][0];

  const result = categories[primaryKey];
  const secondary = categories[secondaryKey];

  const stage = answers[0];
  const priority = answers[2];
  const environment = answers[3];
  const concern = answers[4];

  let stageLabel = "";

  if (stage === "highschool") stageLabel = "高校生向け";
  if (stage === "student") stageLabel = "在学生向け";
  if (stage === "career") stageLabel = "社会人・転職検討者向け";
  if (stage === "parent") stageLabel = "保護者向け";

  document.getElementById("resultTitle").innerText =
    result.title;

  document.getElementById("resultSummary").innerText =
    stageLabel + "の診断結果です。" + result.summary;

  document.getElementById("resultRoute").innerText =
    getRoute(stage, priority, environment);

  document.getElementById("resultField").innerText =
    result.fields;

  document.getElementById("resultReason").innerText =
    result.reason +
    " なお、2番目の候補は「" + secondary.title +
    "」です。こちらの仕事も比較すると、進路の可能性を広げられます。";

  document.getElementById("resultAdvice").innerText =
    getConcernAdvice(concern, priority) +
    " " + result.next;

  const jobsList = document.getElementById("resultJobs");
  jobsList.innerHTML = "";

  result.jobs.forEach(job => {
    const li = document.createElement("li");
    li.innerText = job;
    jobsList.appendChild(li);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function restartQuiz() {
  currentQuestion = 0;
  answers = [];

  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>
